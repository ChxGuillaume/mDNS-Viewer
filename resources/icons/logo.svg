<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#6D7BFF"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#2E1A8A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A5B4FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A5B4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="700" y1="410" x2="560" y2="230">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B0636" flood-opacity="0.35"/>
    </filter>
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#tile)">
    <circle cx="512" cy="512" r="330" fill="url(#glow)"/>

    <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <circle cx="512" cy="512" r="118" stroke-width="20" stroke-opacity="0.55"/>
      <circle cx="512" cy="512" r="212" stroke-width="18" stroke-opacity="0.34"/>
      <circle cx="512" cy="512" r="306" stroke-width="16" stroke-opacity="0.2"/>
    </g>

    <path d="M512 512 L512 206 A306 306 0 0 1 778 361 Z" fill="url(#sweep)"/>
    <line x1="512" y1="512" x2="778" y2="361" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-opacity="0.9"/>

    <g filter="url(#dotGlow)">
      <circle cx="662" cy="362" r="30" fill="#5EEAD4"/>
      <circle cx="295" cy="620" r="24" fill="#FDE68A"/>
      <circle cx="600" cy="807" r="20" fill="#F0ABFC"/>
    </g>

    <circle cx="512" cy="512" r="52" fill="#FFFFFF"/>
    <circle cx="512" cy="512" r="22" fill="#4F46E5"/>

    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>
</svg>
