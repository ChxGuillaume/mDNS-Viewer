name: Microsoft Store

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and submit (e.g. v2.1.0)
        type: string
        required: true
    secrets:
      PARTNER_CENTER_TENANT_ID:
        required: true
      PARTNER_CENTER_SELLER_ID:
        required: true
      PARTNER_CENTER_CLIENT_ID:
        required: true
      PARTNER_CENTER_CLIENT_SECRET:
        required: true
      MS_STORE_PRODUCT_ID:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and submit (e.g. v2.1.0)
        type: string
        required: true

jobs:
  submit:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: ./.github/actions/setup
        with:
          cache-key: microsoft-store

      - name: Build offline installer
        uses: tauri-apps/tauri-action@v1
        with:
          tauriScript: bun run tauri
          args: --bundles nsis --config src-tauri/tauri.microsoftstore.conf.json

      - name: Upload installer to release
        id: upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          ASSET="mDNS-Viewer_${VERSION}_x64_store-setup.exe"
          cp "src-tauri/target/release/bundle/nsis/mDNS Viewer_${VERSION}_x64-setup.exe" "$RUNNER_TEMP/$ASSET"
          gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" --clobber
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET" >> "$GITHUB_OUTPUT"

      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Configure Microsoft Store Developer CLI
        run: >
          msstore reconfigure
          --tenantId ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          --sellerId ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          --clientId ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          --clientSecret ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}

      - name: Submit to Microsoft Store
        shell: pwsh
        env:
          PRODUCT_ID: ${{ secrets.MS_STORE_PRODUCT_ID }}
          PACKAGE_URL: ${{ steps.upload.outputs.url }}
        run: |
          $package = @{
            packages = @(@{
              packageUrl          = $env:PACKAGE_URL
              languages           = @('en-us')
              architectures       = @('X64')
              isSilentInstall     = $false
              installerParameters = '/S'
              packageType         = 'exe'
            })
          } | ConvertTo-Json -Depth 5 -Compress
          msstore submission update $env:PRODUCT_ID $package
          msstore submission publish $env:PRODUCT_ID
