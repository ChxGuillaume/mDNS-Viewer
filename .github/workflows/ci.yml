name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - os: windows-latest
            platform: windows-x64
            rust-targets: ''
            args: ''
          - os: ubuntu-22.04
            platform: linux-x64
            rust-targets: ''
            args: ''
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            rust-targets: ''
            args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          rust-targets: ${{ matrix.rust-targets }}
          cache-key: ${{ matrix.platform }}

      - name: Build
        uses: tauri-apps/tauri-action@v1
        with:
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true

      - name: Package MSIX
        if: runner.os == 'Windows'
        id: msix
        uses: ./.github/actions/package-msix
        with:
          identity-name: ${{ vars.MSIX_IDENTITY_NAME || 'dev.guillaumechx.mdns-viewer' }}
          publisher: ${{ vars.MSIX_PUBLISHER || 'CN=Guillaume Chx' }}
          publisher-display-name: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Guillaume Chx' }}

      - name: Upload MSIX artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: msix
          path: ${{ steps.msix.outputs.path }}
