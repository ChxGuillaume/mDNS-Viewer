name: Setup build environment
description: Installs system dependencies, Bun, Rust and frontend dependencies for a Tauri build
inputs:
  rust-targets:
    description: Extra Rust targets to install (comma separated)
    required: false
    default: ''
  cache-key:
    description: Rust cache key suffix
    required: false
    default: ''
  version:
    description: App version to build, e.g. a release tag like v2.1.0 (empty keeps the 0.0.0 placeholder)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.rust-targets }}

    - name: Cache Rust build
      uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri -> target
        key: ${{ inputs.cache-key }}

    - name: Install frontend dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Set app version
      if: inputs.version != ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: bun scripts/bump-version.ts --set "$VERSION"
