[package]
name = "mdns-viewer"
version = "2.0.0"
description = "Discover and inspect mDNS / DNS-SD services on your local network"
authors = ["Guillaume Chx"]
license = "GPL-3.0-only"
repository = "https://github.com/ChxGuillaume/mDNS-Viewer"
edition = "2024"
rust-version = "1.90"

[lib]
name = "mdns_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.6"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-window-state = "2.5"
tauri-plugin-log = "2.10"
mdns-sd = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
